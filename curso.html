<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor de Curso - Academy OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { darkbg: '#121214', cardbg: '#1c1c21', bordercolor: '#2e2e36', accent: '#00F0FF' } } }
        };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3, .font-tech { font-family: 'Space Grotesk', sans-serif; }
    </style>
</head>
<body class="bg-darkbg text-gray-100 min-h-screen flex flex-col selection:bg-accent selection:text-black">
    <header class="border-b border-bordercolor bg-cardbg px-6 py-4 flex flex-wrap gap-3 items-center justify-between">
        <div class="flex flex-wrap gap-4 items-center">
            <a href="index.html" class="text-xs font-mono text-gray-400 hover:text-accent">← Volver al panel</a>
            <h1 id="course-title" class="font-tech text-sm font-bold">Curso</h1>
        </div>
        <span id="course-progress" class="text-xs font-mono text-gray-400"></span>
    </header>
    <div id="course-workspace" class="flex-1 flex flex-col md:flex-row">
        <aside class="w-full md:w-80 border-b md:border-b-0 md:border-r border-bordercolor bg-cardbg/50 shrink-0">
            <h2 class="p-4 border-b border-bordercolor font-tech text-xs font-bold uppercase tracking-wider text-gray-400">Contenido del curso</h2>
            <nav id="module-list" aria-label="Módulos del curso" class="p-2 space-y-1"></nav>
        </aside>
        <main class="flex-1 p-5 sm:p-8">
            <div class="max-w-4xl mx-auto space-y-6">
                <div>
                    <span id="module-number" class="text-xs font-mono uppercase tracking-wider text-accent"></span>
                    <h2 id="module-title" class="font-tech text-2xl font-bold mt-2"></h2>
                </div>
                <div id="viewer" class="border border-bordercolor bg-cardbg rounded-lg p-4 sm:p-6"></div>
                <div class="border-t border-bordercolor pt-6 flex items-center justify-between gap-3">
                    <button id="previous" class="px-4 py-2 border border-bordercolor hover:border-gray-500 rounded text-xs font-mono uppercase disabled:opacity-40">← Anterior</button>
                    <span id="page-number" class="text-xs font-mono text-gray-400"></span>
                    <button id="next" class="px-4 py-2 bg-accent hover:bg-cyan-400 rounded text-xs font-mono font-semibold uppercase text-black">Siguiente →</button>
                </div>
                <p id="message" role="status" class="text-sm text-accent"></p>
            </div>
        </main>
    </div>
    <script src="academy.js"></script>
    <script>
        const currentUser = Academy.user();
        const courseId = new URLSearchParams(location.search).get('id');
        const course = currentUser && Academy.courses().find(item => item.id === courseId);
        let currentIndex = 0;

        if (currentUser && !course) {
            document.getElementById('course-workspace').textContent = 'No se encontró el curso. Vuelve al panel para seleccionar uno.';
        } else if (course) {
            const completed = Academy.progress(currentUser, course);
            currentIndex = course.modules.findIndex((_, index) => !completed.includes(index));
            if (currentIndex === -1) currentIndex = course.modules.length - 1;
            document.getElementById('course-title').textContent = course.title;
            renderModule();
        }

        function renderModule() {
            const module = course.modules[currentIndex];
            const completed = Academy.progress(currentUser, course);
            document.getElementById('module-number').textContent = `Módulo ${currentIndex + 1}`;
            document.getElementById('module-title').textContent = module.title;
            document.getElementById('page-number').textContent = `${currentIndex + 1} de ${course.modules.length}`;
            document.getElementById('course-progress').textContent = `${completed.length} de ${course.modules.length} completados`;
            document.getElementById('previous').disabled = currentIndex === 0;
            document.getElementById('next').textContent = currentIndex === course.modules.length - 1 ? 'Completar módulo' : 'Completar y seguir →';
            const list = document.getElementById('module-list');
            list.replaceChildren();
            course.modules.forEach((item, index) => {
                const button = document.createElement('button');
                button.className = `w-full p-3 rounded text-left text-xs flex justify-between gap-3 ${index === currentIndex ? 'bg-bordercolor border-l-2 border-accent' : 'hover:bg-bordercolor/50 text-gray-400'}`;
                const name = document.createElement('span');
                name.textContent = `${index + 1}. ${item.title}`;
                const status = document.createElement('span');
                status.className = 'font-mono shrink-0 text-gray-400';
                status.textContent = completed.includes(index) ? 'Completado' : index === currentIndex ? 'En curso' : 'Pendiente';
                button.append(name, status);
                button.addEventListener('click', () => { currentIndex = index; document.getElementById('message').textContent = ''; renderModule(); });
                list.append(button);
            });
            const viewer = document.getElementById('viewer');
            viewer.replaceChildren();
            let content;
            if (module.type === 'text') {
                content = document.createElement('p');
                content.className = 'text-gray-300 leading-relaxed';
                content.textContent = module.content;
            } else if (module.type === 'application/pdf') {
                content = document.createElement('iframe');
                content.title = module.title;
                content.src = module.content;
                content.className = 'w-full h-[65vh] bg-white';
            } else if (module.type.startsWith('image/')) {
                content = document.createElement('img');
                content.alt = module.title;
                content.src = module.content;
                content.className = 'max-w-full max-h-[65vh] mx-auto';
            } else {
                content = document.createElement('video');
                content.controls = true;
                content.src = module.content;
                content.className = 'w-full max-h-[65vh]';
            }
            viewer.append(content);
        }

        document.getElementById('previous').addEventListener('click', () => {
            if (currentIndex > 0) { currentIndex--; document.getElementById('message').textContent = ''; renderModule(); }
        });
        document.getElementById('next').addEventListener('click', () => {
            try {
                Academy.complete(currentUser, course, currentIndex);
                if (currentIndex < course.modules.length - 1) {
                    currentIndex++;
                    document.getElementById('message').textContent = '';
                } else {
                    document.getElementById('message').textContent = 'Módulo completado. Puedes volver al panel.';
                }
                renderModule();
            } catch (error) {
                document.getElementById('message').textContent = 'No se pudo guardar el progreso. Revisa el espacio disponible en el navegador.';
            }
        });
    </script>
</body>
</html>
